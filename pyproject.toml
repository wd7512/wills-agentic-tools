[project]
name = "wills-agentic-tools"
version = "0.2.1"
description = "Gate, repository checks and worker delegation for repos built by coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.5",
    "ty==0.0.78",
]

[project.scripts]
gate = "wills_agentic_tools.gate:main"
check = "wills_agentic_tools.check:main"
delegate = "wills_agentic_tools.delegate:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wills_agentic_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 60

[tool.devtools.gate]
source = "src/"
tests = ["tests"]
